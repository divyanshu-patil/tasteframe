name: Keep API awake

# Render's free plan sleeps a service after ~15 minutes without traffic, and the first request
# then waits ~50 s. Pinging /health every 7 minutes keeps it warm.
# Note: GitHub runs scheduled workflows on a best-effort basis (they can start late), and
# disables them after 60 days without repository activity.

on:
  schedule:
    - cron: "*/7 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping https://tasteframe.onrender.com/health
        run: |
          curl --fail --silent --show-error --max-time 90 \
               --retry 3 --retry-delay 10 --retry-all-errors \
               -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
               https://tasteframe.onrender.com/health
